# MV-17, DT-6.7: the judge stage of the deck-tune eval, an Assay v2 suite, for the three criteria only a reader can settle: ISC-84
# (a cut weighs the card's own text), ISC-87 (a thin plan searches card text for what the plan is about) and ISC-107 (no swap
# reaches the player with a read that says to skip it). Run it by hand on one real session:
#
#   bun server/deck-tune-eval.ts -t "ISC-107" --session <session.jsonl>
#
# `--session` replaces each case's prompt; the suite runs through Assay's runAgenticSuite with an offline replay adapter, so the
# "output" a trial grades is the rendered session, never a fresh generation. The stage only reports: a failed, provisional or
# unavailable judge blocks nothing (the code stage is the eval). A question names no card and no commander. Each case carries an
# adversarial fixture that passes the code-checkable prerequisites and breaks only what the question asks, so the judge is shown
# able to fail.
name: mtg-deck-tune-skill
type: regression
pass_threshold: 1
trials: 3
system_prompt: "Replay suite: the offline adapter returns a recorded deck-tune session; no model under test runs."
cases:
  - id: isc-84-read-before-cut
    prompt: "(a real session, given with --session)"
    assert:
      - type: regex
        value: '### (Swap|Cut) \d'
      - type: llm-assert
        derived_from: ~/Documents/02_areas/mtg-deck-tune/ISA.md#ISC-84
        value: >-
          Wherever a reply suggests cutting a card, it weighs what that card's own rules text does against this deck and its
          commander (how the card would or would not help this deck's plan), and does not judge the cut by its role or label
          alone.
    adversarial_output: |-
      # Deck tune (adversarial fixture)

      ### Claude

      ### Swap 1: Counterspell → Cultivate
      - **Reason (data):** Counterspell holds the counterspell role, which is over its count; mana value 2 → 3.
      - **Deck after:** average mana value 3.09 → 3.11.
      - **My read:** the role is over target, so it goes.

  - id: isc-87-search-the-plan
    prompt: "(a real session, given with --session)"
    assert:
      - type: regex
        value: 'mtg-deck\.find_cards[\s\S]*### (Swap|Cut|Add) \d'
      - type: llm-assert
        derived_from: ~/Documents/02_areas/mtg-deck-tune/ISA.md#ISC-87
        value: >-
          Before the first swap, the session searches card rules text for what the player's plan is about (the interaction the
          player described or the cards they named make happen), not for an unrelated phrase.
    adversarial_output: |-
      # Deck tune (adversarial fixture)

      ### Player

      Think of cheap mana rocks that make my turns explosive.

      ### Tool `mtg-deck.find_cards`

      input: `{"rulesText":["draw a card"],"colorIdentity":"GU"}`

      ```
      {"cards":{"columns":["name","manaValue"],"rows":[["Harmonize",4]]}}
      ```

      ### Claude

      ### Swap 1: Counterspell → Harmonize
      - **Reason (data):** Harmonize draws cards.
      - **Deck after:** average mana value 3.09 → 3.2.
      - **My read:** a reasonable card.

  - id: isc-107-only-recommended-swaps
    prompt: "(a real session, given with --session)"
    assert:
      - type: llm-assert
        derived_from: ~/Documents/02_areas/mtg-deck-tune/ISA.md#ISC-107
        value: >-
          Every swap, cut or add the reply shows the player is one Claude recommends: none of them carries a read that says to skip
          it, pass on it, avoid it, that it is not worth making, or that Claude would not make it. A swap Claude would advise
          against is filtered out before it is shown.
    adversarial_output: |-
      # Deck tune (adversarial fixture)

      ### Claude

      ### Swap 1: Counterspell → Cultivate
      - **Reason (data):** both do a job the plan wants; mana value 2 → 3.
      - **Deck after:** average mana value 3.09 → 3.11.
      - **My read:** a small gain at best. Skip it.
